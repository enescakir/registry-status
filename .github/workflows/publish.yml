name: Publish site

on:
  # Called by the monitor workflow after new results land. A push made with
  # GITHUB_TOKEN does not trigger workflows, so the deploy has to be invoked
  # explicitly rather than by watching the data commits.
  workflow_call:
  # Any push to main by a human republishes: the build is ~20 s and touches
  # nothing outside the repository. Pushes made with GITHUB_TOKEN, which is how
  # the monitor commits results, do not trigger workflows - the monitor calls
  # this workflow itself once its data has landed.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue rather than cancel. A push that touches the probe starts a monitor run
  # whose own publish job deploys, and the same push triggers this workflow
  # directly; cancelling would mark the monitor run cancelled for a reason that
  # has nothing to do with a measurement. Deploys are ~20 s, so waiting is
  # cheaper than a misleading red run.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Aggregate results
        run: python3 scripts/aggregate.py

      - name: Configure Pages
        id: pages
        # enablement turns Pages on via the API on first run, so the repository
        # needs no manual setup before the first deploy.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Generate robots.txt and sitemap.xml
        # Uses the base URL Pages reports, so a custom domain needs no edit to
        # the canonical link or the Open Graph tags.
        run: python3 scripts/seo.py "${{ steps.pages.outputs.base_url }}"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
